# 50 test cases: 10 fictional Larkspur Outfitters products x 5 AI-written descriptions (fixtures/descriptions.json).
# vars carry the product facts the rules read; metadata.expect_fail lists the rules a case is written to break
# (the rules never read metadata). List-like vars are comma-separated strings on purpose: promptfoo expands
# a YAML list in vars into one test per item. Keep case_id in step with fixtures/descriptions.json.
- description: 'c01 Ridgeline Rain Shell: clean; uses the legal-approved claim ''fully waterproof'''
  vars:
    case_id: c01
    sku: LK-JKT-001
    product_name: Ridgeline Rain Shell
    materials: recycled nylon, polyurethane membrane
    care_note: Machine wash cold and hang to dry.
    approved_claims: fully waterproof
  metadata:
    expect_fail: []
