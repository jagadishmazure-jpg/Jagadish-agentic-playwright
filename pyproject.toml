[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-playwright"
version = "0.1.0"
description = "Larkspur demo app (AI returns assistant) and a guarded browser agent that drives Playwright MCP."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi==0.143.0",
  "uvicorn==0.54.0",
  "python-multipart==0.0.32",
  "agent-framework-core==1.21.0", # Microsoft Agent Framework: the browser agent's chat loop and tools
  "mcp==2.3.0",                   # MCP client used to talk to the Playwright MCP server over stdio
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.17.0", "pyyaml==6.0.3"]

[project.scripts]
larkspur = "larkspur.cli:main"
handsagent = "browser_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
larkspur = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests/py"]
addopts = "-q"

[tool.ruff]
line-length = 200
target-version = "py311"
extend-exclude = ["node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S311", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
