# Deploy the cloud test stack (Azure Playwright workspace + Container Apps hosting of the demo app):
# dev -> (approval) -> prod with Terraform or Bicep, then run the suite on cloud browsers against it.
#
# GATED OFF: every job except `preflight` runs only when the repository variable
# DEPLOY_ENABLED == 'true'. It is not set, so on push to main this workflow reports the gate and
# skips. Nothing in this repository has been deployed. See docs/azure.md for the one-time
# setup (OIDC federated credential, GitHub Environments `dev` and `prod` with required
# reviewers, Terraform state storage).
#
# Azure login is OIDC only (azure/login with a federated credential): no client secret exists.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_tool:
        description: "IaC tool"
        type: choice
        options: [terraform, bicep]
        default: terraform
      promote_to_prod:
        description: "Continue to prod after dev (prod still waits for reviewer approval)"
        type: boolean
        default: true
      location:
        description: "Azure region"
        type: string
        default: eastus2
permissions:
  contents: read
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false
env:
  DEPLOY_TOOL: ${{ inputs.deploy_tool || vars.DEPLOY_TOOL || 'terraform' }}
  LOCATION: ${{ inputs.location || vars.AZURE_LOCATION || 'eastus2' }}
  TF_VERSION: "1.16.4"
jobs:

  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Report deploy gate
        env:
          ENABLED: ${{ vars.DEPLOY_ENABLED == 'true' }}
        run: |
          {
            echo "### Deploy gate"
            echo "- DEPLOY_ENABLED: \`${ENABLED}\` (deploy jobs run only when this is true)"
            echo "- deploy tool: \`${DEPLOY_TOOL}\`, region: \`${LOCATION}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "$ENABLED" == "true" ]] || echo "::notice::Deployment disabled (repository variable DEPLOY_ENABLED is not 'true'); deploy jobs are skipped."

  deploy-dev:
    needs: preflight
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      TARGET_ENV: dev
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      RUNNER_PRINCIPAL_ID: ${{ vars.AZURE_RUNNER_PRINCIPAL_ID }}
      TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
      TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
    outputs:
      app_url: ${{ steps.final.outputs.app_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with: { terraform_version: "${{ env.TF_VERSION }}", terraform_wrapper: false }
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Provision registry, workspace and app (placeholder image on first run)
        id: provision
        run: .github/scripts/deploy.sh provision
      - name: Build and push the demo app image (az acr build)
        id: image
        env: { REGISTRY: "${{ steps.provision.outputs.registry }}" }
        run: .github/scripts/deploy.sh image
      - name: Roll the app to the new image
        id: final
        env: { APP_IMAGE: "${{ steps.image.outputs.app_image }}" }
        run: .github/scripts/deploy.sh provision
      - name: Smoke checks (app healthy, workspace Entra-only)
        env: { APP_URL: "${{ steps.final.outputs.app_url }}", WORKSPACE_ID: "${{ steps.final.outputs.workspace_id }}" }
        run: .github/scripts/deploy.sh smoke

  deploy-prod:
    needs: deploy-dev
    if: vars.DEPLOY_ENABLED == 'true' && (github.event_name == 'push' || inputs.promote_to_prod)
    runs-on: ubuntu-latest
    environment: prod # required reviewers are configured on this environment
    permissions:
      contents: read
      id-token: write
    env:
      TARGET_ENV: prod
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      RUNNER_PRINCIPAL_ID: ${{ vars.AZURE_RUNNER_PRINCIPAL_ID }}
      TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
      TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
    outputs:
      app_url: ${{ steps.final.outputs.app_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with: { terraform_version: "${{ env.TF_VERSION }}", terraform_wrapper: false }
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Provision registry, workspace and app (placeholder image on first run)
        id: provision
        run: .github/scripts/deploy.sh provision
      - name: Build and push the demo app image (az acr build)
        id: image
        env: { REGISTRY: "${{ steps.provision.outputs.registry }}" }
        run: .github/scripts/deploy.sh image
      - name: Roll the app to the new image
        id: final
        env: { APP_IMAGE: "${{ steps.image.outputs.app_image }}" }
        run: .github/scripts/deploy.sh provision
      - name: Smoke checks (app healthy, workspace Entra-only)
        env: { APP_URL: "${{ steps.final.outputs.app_url }}", WORKSPACE_ID: "${{ steps.final.outputs.workspace_id }}" }
        run: .github/scripts/deploy.sh smoke

  cloud-browsers:
    needs: deploy-dev
    if: vars.DEPLOY_ENABLED == 'true' && vars.PLAYWRIGHT_SERVICE_URL != ''
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      PLAYWRIGHT_SERVICE_URL: ${{ vars.PLAYWRIGHT_SERVICE_URL }}
      TEST_ENV: staging
      BASE_URL: ${{ needs.deploy-dev.outputs.app_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Suite on Azure Playwright cloud browsers (Entra ID via DefaultAzureCredential)
        run: npx playwright test --config=playwright.service.config.ts --project=setup --project=api --project=chromium --workers=20
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with: { name: cloud-browser-report, path: playwright-report, retention-days: 14 }
