# Offline CI: lint, unit tests, promptfoo copy evals (offline fixture provider), repo-hygiene tests (workflow pinning, no PDFs, no deploy claims),
# the release gate, doc drift, TypeScript typecheck, Bicep build, SBOM and a secret scan.
# Nothing here talks to Azure. Actions are pinned to commit SHAs (Dependabot bumps them).
name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Unit + hygiene tests
        run: pytest -q
      - name: Release gate (injections blocked, no secrets to the model, no flaky executions)
        run: python scripts/gate.py | tee gate.txt
      - name: Docs match evidence
        run: python scripts/render_docs.py --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: { name: gate-report, path: gate.txt, if-no-files-found: ignore }

  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - name: tsc (framework, tests, both Playwright configs)
        run: npm run typecheck
      - name: Test list compiles (every project)
        run: npx playwright test --list --project=setup --project=api --project=chromium --project=healing --project=generated --project=visual > /dev/null

  promptfoo:
    # Business-rule evals for AI-written product copy. Offline: the provider replays fixtures,
    # so there is no API key, no model call and no cost. The summary --check is the gate.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run: { working-directory: evals/promptfoo }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "22", cache: npm, cache-dependency-path: evals/promptfoo/package-lock.json }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - run: npm ci
      - name: Unit tests for the rule functions (node --test)
        run: npm test
      - name: promptfoo eval, named rules and bare booleans (offline)
        run: npm run eval
      - name: Every case failed exactly its planted rules; evidence matches
        run: python ../../scripts/promptfoo_summary.py --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: { name: promptfoo-results, path: evals/promptfoo/out/*.json, if-no-files-found: ignore }

  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Bicep CLI (pinned)
        run: |
          curl -sSLo bicep https://github.com/Azure/bicep/releases/download/v0.47.16/bicep-linux-x64
          chmod +x bicep && sudo mv bicep /usr/local/bin/bicep && bicep --version
      - name: bicep build (linter runs as part of build; warnings fail the job)
        run: |
          bicep build infra/bicep/main.bicep --stdout > /dev/null 2> bicep.log || { cat bicep.log; exit 1; }
          cat bicep.log
          if grep -q "Warning" bicep.log; then exit 1; fi

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Software bill of materials (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          artifact-name: sbom.spdx.json
          upload-release-assets: false

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - name: gitleaks (full history)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
